{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Epic Events{% endblock %}</title>
</head>
<body>
    <nav>
        {% if not request.user.is_authenticated %}
            <a href="{% url 'landing-page' %}"></a>
        {% else %}
            <a href="{% url 'homepage' %}">Homepage</a>
            <a href="{% url 'make-queries' %}">Queries</a>
            <a href="{% url 'profile-page' %}">My Profile</a>
            <a href="{% url %}">Logout</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
