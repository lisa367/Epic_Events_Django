{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Epic Events{% endblock %}</title>
</head>
<body>
    <nav>
        {% if not request.user.is_authenticated %}
            <a href="{% url %}"></a>
        {% else %}
            <a href="{% url %}">MyPage</a>
            <a href="{% url %}">Queries</a>
            <a href="{% url %}">Logout</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
