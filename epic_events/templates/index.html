{% extends 'base.html' %}

{% block content %}
<div class="content">
    <h1>Bienvenue sur Epic Events CRM</h1>
    {% if request.user.is_authenticated %}
    <a href="{% url 'employee:homepage' %}">Accéder à ma page d'accueil</a>
    {% else %}
    <form action="" method="POST">
        {% csrf_token %}
        {{ form.as_table }}
        <input type="submit" value="Login">
    </form>
    {% endif %}
</div>
{% endblock %}
